# Keeps the personal assistant's calls on time.
# Every 5 minutes this pings Elister's /api/cron/tick: on Render's free plan that stops the server from sleeping (so its built-in
# one-minute scheduler keeps running) and rings anything that is due. No secrets needed. GitHub may delay runs by a few minutes.
# Optional repo secret ELISTER_URL overrides the address (default: the Render demo).
name: Assistant calls
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Elister and ring due calls
        env:
          ELISTER_URL: ${{ secrets.ELISTER_URL }}
        run: |
          URL="${ELISTER_URL:-https://elister-med.onrender.com}"
          curl -sS -m 180 --retry 2 --retry-delay 20 "$URL/api/cron/tick" || echo "Elister did not answer (it may be waking up)"
