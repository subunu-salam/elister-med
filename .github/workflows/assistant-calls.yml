# Rings the personal AI assistant's calls on time.
# Vercel's free plan only allows one cron a day (vercel.json: 18:00 Dubai). This job checks every 5 minutes, so custom call times and
# "call me back in 30 minutes" ring within a few minutes. GitHub may delay scheduled runs by a few minutes when busy.
#
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   ELISTER_URL   the production address, e.g. https://elister.devxpert.ae
#   CRON_SECRET   the same value as CRON_SECRET in the Vercel project
name: Assistant calls
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ring everyone who is due
        env:
          ELISTER_URL: ${{ secrets.ELISTER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ELISTER_URL" ] || [ -z "$CRON_SECRET" ]; then echo "ELISTER_URL / CRON_SECRET not set; skipping."; exit 0; fi
          curl -fsS -m 240 -H "Authorization: Bearer $CRON_SECRET" "$ELISTER_URL/api/cron/daily-brief"
